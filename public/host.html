<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Gatho Host</title>
<style>
  :root { --bg:#faf7f2; --card:#fff; --ink:#1f1d1a; --muted:#7a746b; --accent:#e4572e; --line:#ece6dc; --go:#2e9e5b; --maybe:#e0a526; --no:#c0392b; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width:520px; margin:0 auto; padding:24px 16px 64px; }
  .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
  .brand { font-weight:800; letter-spacing:-.5px; color:var(--accent); font-size:20px; text-decoration:none; }
  .link { background:none; border:none; color:var(--muted); font-size:14px; cursor:pointer; text-decoration:underline; padding:0; font-family:inherit; }
  .link.danger { color:var(--no); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:20px; margin-bottom:16px; }
  .card.flush { padding:0; overflow:hidden; }
  .inner { padding:20px; }
  .banner { width:100%; height:130px; background-size:cover; background-position:center; }
  h1 { margin:0 0 12px; font-size:24px; letter-spacing:-.5px; }
  h2 { margin:0 0 4px; font-size:20px; letter-spacing:-.3px; }
  label { display:block; font-size:13px; font-weight:600; color:var(--muted); margin:12px 0 4px; }
  input, textarea { width:100%; padding:12px; font-size:16px; font-family:inherit; border:1px solid var(--line); border-radius:12px; background:#fff; }
  textarea { min-height:90px; resize:vertical; }
  .btn { display:block; width:100%; margin-top:16px; padding:14px; font-size:16px; font-weight:700; border:none; border-radius:12px; background:var(--accent); color:#fff; cursor:pointer; font-family:inherit; }
  .btn.alt { background:#fff; color:var(--accent); border:2px solid var(--accent); margin-top:8px; }
  .btn.small { display:inline-block; width:auto; padding:10px 16px; font-size:14px; margin:12px 8px 0 0; }
  .btn:disabled { opacity:.6; }
  .muted { color:var(--muted); font-size:14px; }
  .msg { margin-top:12px; font-size:14px; min-height:18px; }
  .err { color:var(--no); }
  .ok { color:var(--go); }
  .counts { display:flex; gap:14px; margin:12px 0 4px; font-size:14px; color:var(--muted); }
  .counts b { color:var(--ink); }
  .list { margin-top:8px; font-size:14px; line-height:1.5; }
  .li { display:flex; justify-content:space-between; gap:10px; padding:6px 0; border-top:1px solid var(--line); align-items:flex-start; }
  .li:first-child { border-top:none; }
  .li .t { overflow-wrap:anywhere; white-space:pre-wrap; }
  .pill { display:inline-block; font-size:12px; font-weight:700; padding:2px 8px; border-radius:99px; color:#fff; margin-right:6px; }
  .pill.going { background:var(--go); } .pill.maybe { background:var(--maybe); } .pill.not_going { background:var(--no); }
  details summary { cursor:pointer; color:var(--accent); font-weight:600; font-size:14px; margin-top:12px; }
  .center { text-align:center; padding:40px 8px; }
  .coverprev { width:100%; aspect-ratio:16/9; border-radius:12px; border:1px dashed var(--line); background:#f4efe7 center/cover no-repeat; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:14px; }
  .row2 { display:flex; gap:8px; align-items:center; margin-top:8px; }
  .row2 .link { margin-left:auto; }
  .filebtn { display:inline-block; padding:10px 16px; font-size:14px; font-weight:700; border:2px solid var(--accent); color:var(--accent); border-radius:12px; cursor:pointer; }
  .filebtn input { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="brand" href="/">gatho</a>
    <button class="link" id="signout" style="display:none">Sign out</button>
  </div>
  <div id="app"><div class="center muted">Loading…</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://wjnfkqkzbblijzmbcasx.supabase.co";
const SUPABASE_KEY = "sb_publishable_re5_9n7OLaKaCFGuIMlVvw_OIEsla_V";
const COVER_PREFIX = SUPABASE_URL + "/storage/v1/object/public/covers/";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const app = document.getElementById("app");
const signoutBtn = document.getElementById("signout");

function el(tag, cls, text){
  const n = document.createElement(tag);
  if(cls) n.className = cls;
  if(text !== undefined) n.textContent = text;
  return n;
}
function field(labelText, input){
  const w = document.createElement("div");
  w.append(el("label", null, labelText), input);
  return w;
}
function input(type, placeholder){
  const i = document.createElement("input");
  i.type = type;
  if(placeholder) i.placeholder = placeholder;
  return i;
}
function fmt(iso){
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { weekday:"short", day:"numeric", month:"short" }) + " · " +
         d.toLocaleTimeString(undefined, { hour:"numeric", minute:"2-digit" });
}
function toLocalInput(iso){
  const d = new Date(iso), p = n => String(n).padStart(2,"0");
  return d.getFullYear() + "-" + p(d.getMonth()+1) + "-" + p(d.getDate()) + "T" + p(d.getHours()) + ":" + p(d.getMinutes());
}
function uuid(){ return crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2); }
function validCover(u){ return u && u.startsWith(COVER_PREFIX); }

/* Resize + re-encode as JPEG. This keeps files small and strips hidden
   photo data such as GPS location before anything is uploaded. */
function resizeImage(file, maxW){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const scale = Math.min(1, maxW / img.width);
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => {
        URL.revokeObjectURL(url);
        b ? resolve(b) : reject(new Error("Could not process that image"));
      }, "image/jpeg", 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("That file doesn't look like an image")); };
    img.src = url;
  });
}

async function init(){
  const { data: { session } } = await sb.auth.getSession();
  if(session) showDashboard(); else showLogin();
}
sb.auth.onAuthStateChange((event) => { if(event === "SIGNED_OUT") showLogin(); });
signoutBtn.addEventListener("click", async () => { await sb.auth.signOut(); });

/* ---------- Login ---------- */
function showLogin(){
  signoutBtn.style.display = "none";
  const card = el("div","card");
  card.appendChild(el("h1", null, "Host sign in"));
  card.appendChild(el("p","muted","Sign in or create an account to make events. Guests never need one."));
  const email = input("email","you@example.com"); email.autocomplete = "email";
  const pass = input("password","Password (6+ characters)"); pass.autocomplete = "current-password";
  card.append(field("Email", email), field("Password", pass));
  const msg = el("div","msg");
  const inBtn = el("button","btn","Sign in");
  const upBtn = el("button","btn alt","Create account");

  inBtn.addEventListener("click", async () => {
    msg.className = "msg muted"; msg.textContent = "Signing in…";
    const { error } = await sb.auth.signInWithPassword({ email: email.value.trim(), password: pass.value });
    if(error){ msg.className = "msg err"; msg.textContent = error.message; return; }
    showDashboard();
  });
  upBtn.addEventListener("click", async () => {
    msg.className = "msg muted"; msg.textContent = "Creating account…";
    const { data, error } = await sb.auth.signUp({ email: email.value.trim(), password: pass.value });
    if(error){ msg.className = "msg err"; msg.textContent = error.message; return; }
    if(!data.session){ msg.className = "msg ok"; msg.textContent = "Check your email to confirm, then sign in."; return; }
    showDashboard();
  });
  card.append(inBtn, upBtn, msg);
  app.replaceChildren(card);
}

/* ---------- Dashboard ---------- */
async function showDashboard(){
  signoutBtn.style.display = "inline";
  app.replaceChildren(el("div","center muted","Loading your events…"));

  const { data: events, error } = await sb
    .from("events")
    .select("id, slug, title, starts_at, ends_at, location, description, cover_url, rsvps(id, guest_name, status, plus_ones), comments(id, guest_name, body, created_at, host_reply, host_reply_at)")
    .order("starts_at", { ascending: true });

  const root = document.createElement("div");
  const newBtn = el("button","btn","+ Create event");
  newBtn.style.marginTop = "0"; newBtn.style.marginBottom = "16px";
  newBtn.addEventListener("click", () => showForm());
  root.appendChild(newBtn);

  if(error){
    root.appendChild(el("p","msg err","Couldn't load events: " + error.message));
  } else if(!events.length){
    const c = el("div","card");
    c.appendChild(el("p","muted","No events yet. Tap Create event to make your first one."));
    root.appendChild(c);
  } else {
    events.forEach(ev => root.appendChild(eventCard(ev)));
  }
  app.replaceChildren(root);
}

function eventCard(ev){
  const card = el("div","card flush");
  if(validCover(ev.cover_url)){
    const b = el("div","banner"); b.style.backgroundImage = 'url("' + ev.cover_url + '")'; card.appendChild(b);
  }
  const inner = el("div","inner");
  inner.appendChild(el("h2",null,ev.title));
  inner.appendChild(el("div","muted", fmt(ev.starts_at) + (ev.location ? " · " + ev.location : "")));

  const r = ev.rsvps || [];
  const total = s => r.filter(x => x.status === s).reduce((n,x) => n + 1 + (x.plus_ones || 0), 0);
  const counts = el("div","counts");
  [["going","going"],["maybe","maybe"],["not_going","can't go"]].forEach(([s,label]) => {
    const n = s === "not_going" ? r.filter(x => x.status === s).length : total(s);
    const sp = el("span"); sp.append(el("b",null,String(n))," " + label); counts.appendChild(sp);
  });
  inner.appendChild(counts);

  const url = location.origin + "/e/" + ev.slug;
  const share = el("button","btn small","Share invite");
  share.addEventListener("click", async () => {
    const text = "You're invited to " + ev.title + "! RSVP here:";
    if(navigator.share){ try { await navigator.share({ title: ev.title, text, url }); } catch(e){} }
    else await copy(url, share);
  });
  const copyBtn = el("button","btn small alt","Copy link");
  copyBtn.addEventListener("click", () => copy(url, copyBtn));
  const editBtn = el("button","btn small alt","Edit");
  editBtn.addEventListener("click", () => showForm(ev));
  inner.append(share, copyBtn, editBtn);

  if(r.length){
    const d = document.createElement("details");
    d.appendChild(el("summary",null,"Who's replied (" + r.length + ")"));
    const list = el("div","list");
    [["going","Going"],["maybe","Maybe"],["not_going","Can't go"]].forEach(([s,label]) => {
      r.filter(x => x.status === s).forEach(x => {
        const li = el("div","li");
        const t = el("div","t");
        t.append(el("span","pill " + s, label), document.createTextNode(x.guest_name + (x.plus_ones ? "  +" + x.plus_ones : "")));
        const rm = el("button","link danger","Remove");
        rm.addEventListener("click", async () => {
          if(!confirm("Remove " + x.guest_name + "'s reply?")) return;
          const { error } = await sb.from("rsvps").delete().eq("id", x.id);
          if(error){ alert("Couldn't remove: " + error.message); return; }
          showDashboard();
        });
        li.append(t, rm); list.appendChild(li);
      });
    });
    d.appendChild(list); inner.appendChild(d);
  }

  const cm = (ev.comments || []).slice().sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
  if(cm.length){
    const d = document.createElement("details");
    const needReply = cm.filter(c => !c.host_reply).length;
    d.appendChild(el("summary",null,"Comments (" + cm.length + (needReply ? " · " + needReply + " to reply" : "") + ")"));
    const list = el("div","list");
    cm.forEach(c => {
      const li = el("div","li");
      const left = el("div");
      left.style.flex = "1"; left.style.minWidth = "0";
      const t = el("div","t");
      t.append(el("b",null,c.guest_name + ": "), document.createTextNode(c.body));
      left.appendChild(t);
      if(c.host_reply){
        const rp = el("div","muted");
        rp.style.marginTop = "4px";
        rp.textContent = "↳ Your reply: " + c.host_reply;
        left.appendChild(rp);
      }
      const rbtn = el("button","link", c.host_reply ? "Edit reply" : "Reply");
      rbtn.style.display = "block"; rbtn.style.marginTop = "4px";
      rbtn.addEventListener("click", () => { rbtn.style.display = "none"; left.appendChild(replyForm(c)); });
      left.appendChild(rbtn);
      const rm = el("button","link danger","Delete");
      rm.addEventListener("click", async () => {
        if(!confirm("Delete this comment?")) return;
        const { error } = await sb.from("comments").delete().eq("id", c.id);
        if(error){ alert("Couldn't delete: " + error.message); return; }
        showDashboard();
      });
      li.append(left, rm); list.appendChild(li);
    });
    d.appendChild(list); inner.appendChild(d);
  }

  const del = el("button","link danger","Delete event");
  del.style.display = "block"; del.style.marginTop = "16px";
  del.addEventListener("click", async () => {
    if(!confirm("Delete \"" + ev.title + "\" and all its replies and comments?")) return;
    const { error } = await sb.from("events").delete().eq("id", ev.id);
    if(error){ alert("Couldn't delete: " + error.message); return; }
    removeCoverFile(ev.cover_url);
    showDashboard();
  });
  inner.appendChild(del);

  card.appendChild(inner);
  return card;
}

async function copy(text, btn){
  const old = btn.textContent;
  try { await navigator.clipboard.writeText(text); btn.textContent = "Copied!"; }
  catch(e){ window.prompt("Copy this link:", text); }
  setTimeout(() => { btn.textContent = old; }, 1500);
}
async function sendReply(id, text){
  const { error } = await sb.rpc("reply_to_comment", { p_comment_id: id, p_body: text });
  return error ? error.message : null;
}
function replyForm(c){
  const form = el("div");
  form.style.marginTop = "6px";
  const ta = document.createElement("textarea");
  ta.maxLength = 500; ta.placeholder = "Write a reply…"; ta.value = c.host_reply || "";
  const msg = el("div","msg");
  const row = el("div","row2");
  const send = el("button","btn small","Send reply"); send.type = "button"; send.style.margin = "0";
  const cancel = el("button","link","Cancel"); cancel.type = "button";
  row.append(send, cancel);
  if(c.host_reply){
    const rm = el("button","link danger","Remove reply"); rm.type = "button";
    row.appendChild(rm);
    rm.addEventListener("click", async () => {
      const err = await sendReply(c.id, "");
      if(err){ msg.className = "msg err"; msg.textContent = err; } else showDashboard();
    });
  }
  send.addEventListener("click", async () => {
    const text = ta.value.trim();
    if(!text){ msg.className = "msg err"; msg.textContent = "Write a reply first."; return; }
    send.disabled = true; msg.className = "msg muted"; msg.textContent = "Sending…";
    const err = await sendReply(c.id, text);
    if(err){ send.disabled = false; msg.className = "msg err"; msg.textContent = err; } else showDashboard();
  });
  cancel.addEventListener("click", showDashboard);
  form.append(ta, row, msg);
  return form;
}
function removeCoverFile(url){
  if(!validCover(url)) return;
  const path = url.slice(COVER_PREFIX.length);
  sb.storage.from("covers").remove([path]).catch(() => {});
}

/* ---------- Create / edit ---------- */
function showForm(ev){
  const editing = !!ev;
  const card = el("div","card");
  card.appendChild(el("h1",null, editing ? "Edit event" : "New event"));

  const title = input("text","e.g. Oli's birthday drinks"); title.maxLength = 100;
  const start = input("datetime-local");
  const end = input("datetime-local");
  const loc = input("text","Where is it?"); loc.maxLength = 200;
  const desc = document.createElement("textarea");
  desc.placeholder = "Anything guests should know (what to bring, dress code…)"; desc.maxLength = 2000;

  if(editing){
    title.value = ev.title;
    start.value = toLocalInput(ev.starts_at);
    end.value = ev.ends_at ? toLocalInput(ev.ends_at) : "";
    loc.value = ev.location || "";
    desc.value = ev.description || "";
  } else {
    const d = new Date(); d.setDate(d.getDate() + 1); d.setHours(19,0,0,0);
    start.value = toLocalInput(d.toISOString());
  }

  // cover photo
  let newBlob = null, removeCover = false;
  const prev = el("div","coverprev");
  function showPrev(url){
    if(url){ prev.style.backgroundImage = 'url("' + url + '")'; prev.textContent = ""; }
    else { prev.style.backgroundImage = "none"; prev.textContent = "No cover photo"; }
  }
  showPrev(editing && validCover(ev.cover_url) ? ev.cover_url : null);

  const pick = el("label","filebtn","Choose photo");
  pick.style.margin = "0";
  const file = document.createElement("input"); file.type = "file"; file.accept = "image/*";
  pick.appendChild(file);
  const rm = el("button","link","Remove photo"); rm.type = "button";
  const row = el("div","row2"); row.append(pick, rm);
  const cmsg = el("div","msg");

  file.addEventListener("change", async () => {
    const f = file.files && file.files[0];
    if(!f) return;
    cmsg.className = "msg muted"; cmsg.textContent = "Preparing photo…";
    try {
      newBlob = await resizeImage(f, 1600);
      removeCover = false;
      showPrev(URL.createObjectURL(newBlob));
      cmsg.textContent = "";
    } catch(e){ newBlob = null; cmsg.className = "msg err"; cmsg.textContent = e.message; }
  });
  rm.addEventListener("click", () => { newBlob = null; removeCover = true; file.value = ""; showPrev(null); cmsg.textContent = ""; });

  card.append(
    field("Event name", title),
    field("Starts", start),
    field("Ends (optional)", end),
    field("Location", loc),
    field("Details", desc),
    el("label",null,"Cover photo (optional)"), prev, row, cmsg
  );

  const msg = el("div","msg");
  const save = el("button","btn", editing ? "Save changes" : "Create & share");
  const cancel = el("button","btn alt","Cancel");
  cancel.addEventListener("click", showDashboard);

  save.addEventListener("click", async () => {
    if(!title.value.trim() || !start.value){ msg.className = "msg err"; msg.textContent = "Add a name and start time."; return; }
    if(end.value && new Date(end.value) <= new Date(start.value)){ msg.className = "msg err"; msg.textContent = "The end time must be after the start."; return; }
    save.disabled = true; msg.className = "msg muted"; msg.textContent = editing ? "Saving…" : "Creating…";

    let cover_url = editing ? ev.cover_url : null;
    if(newBlob){
      const { data: { user } } = await sb.auth.getUser();
      const path = user.id + "/" + uuid() + ".jpg";
      const up = await sb.storage.from("covers").upload(path, newBlob, { contentType:"image/jpeg", cacheControl:"31536000" });
      if(up.error){ save.disabled = false; msg.className = "msg err"; msg.textContent = "Photo upload failed: " + up.error.message; return; }
      cover_url = sb.storage.from("covers").getPublicUrl(path).data.publicUrl;
    } else if(removeCover){
      cover_url = null;
    }

    const payload = {
      title: title.value.trim(),
      starts_at: new Date(start.value).toISOString(),
      ends_at: end.value ? new Date(end.value).toISOString() : null,
      location: loc.value.trim() || null,
      description: desc.value.trim() || null,
      cover_url
    };

    if(editing){
      const { error } = await sb.from("events").update(payload).eq("id", ev.id);
      if(error){ save.disabled = false; msg.className = "msg err"; msg.textContent = error.message; return; }
      if(ev.cover_url && ev.cover_url !== cover_url) removeCoverFile(ev.cover_url);
      showDashboard();
    } else {
      const { data, error } = await sb.from("events").insert(payload).select("slug, title").single();
      if(error){ save.disabled = false; msg.className = "msg err"; msg.textContent = error.message; return; }
      showCreated(data);
    }
  });

  card.append(save, cancel, msg);
  app.replaceChildren(card);
}

function showCreated(ev){
  const url = location.origin + "/e/" + ev.slug;
  const card = el("div","card");
  card.appendChild(el("h1",null,"You're all set 🎉"));
  card.appendChild(el("p","muted","Send this link to your guests. They don't need an account."));
  const box = input("text"); box.value = url; box.readOnly = true;
  card.appendChild(box);

  const share = el("button","btn","Share invite");
  share.addEventListener("click", async () => {
    const text = "You're invited to " + ev.title + "! RSVP here:";
    if(navigator.share){ try { await navigator.share({ title: ev.title, text, url }); } catch(e){} }
    else await copy(url, share);
  });
  const copyBtn = el("button","btn alt","Copy link");
  copyBtn.addEventListener("click", () => copy(url, copyBtn));
  const done = el("button","btn alt","Back to my events");
  done.addEventListener("click", showDashboard);
  card.append(share, copyBtn, done);
  app.replaceChildren(card);
}

init();
</script>
</body>
</html>
